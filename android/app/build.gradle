plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.flutter.android'  // Flutter Gradle 插件，正式名称叫 'org.flutter.android'
}

android {
    namespace 'com.example.test_application'  // 你的包名
    compileSdk 34  // 注意 compileSdkVersion 改为 compileSdk，Gradle 8 新写法

    defaultConfig {
        applicationId "com.example.test_application"
        minSdk 21    // minSdkVersion 改为 minSdk
        targetSdk 34 // targetSdkVersion 改为 targetSdk
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}
