name: Android CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-distribute:
    name: Build & Upload APK
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'

      # 3. 拉取依赖
      - name: Flutter pub get
        run: flutter pub get

      # 4. 配置 keystore （把 keystore 和 key.properties 加到 Secrets/Artifact）
      - name: Setup keystore
        run: |
          echo "${{ secrets.KEY_PROPERTIES }}" > key.properties
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/key.jks

      # 5. 构建 Release APK
      - name: Build APK
        run: flutter build apk --release

      # 6. 上传到 GitHub Artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
